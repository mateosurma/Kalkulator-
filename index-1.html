<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator</title>
<meta name="theme-color" content="#12171C">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* Układ: jedna kolumna. Na górze trzy ostatnie wyniki, pod nimi jedna kreska,
   wyświetlacz, klawisze. "=" na dole po całej szerokości (wygodnie dla prawej ręki). */
:root {
  --bg: #E4E8EC;
  --fg: #16202A;
  --muted: #5B6773;
  --line: #9AA6B2;
  --key: #F6F8FA;
  --key-edge: #AEB8C3;
  --op: #C7D2DF;
  --fn: #D7DDE4;
  --accent: #C94310;
  --accent-fg: #FFFFFF;
  --err: #B42318;
  --ui: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Spline Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171C;
    --fg: #E7ECF1;
    --muted: #8E9AA7;
    --line: #4A5764;
    --key: #232B34;
    --key-edge: #080B0E;
    --op: #354252;
    --fn: #2B3540;
    --accent: #FF8F52;
    --accent-fg: #1A0E05;
    --err: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171C;
  --fg: #E7ECF1;
  --muted: #8E9AA7;
  --line: #4A5764;
  --key: #232B34;
  --key-edge: #080B0E;
  --op: #354252;
  --fn: #2B3540;
  --accent: #FF8F52;
  --accent-fg: #1A0E05;
  --err: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }

.app {
  height: 100%;
  max-width: 820px;
  margin-inline: auto;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: 12px;
  min-width: 0;
}

/* Trzy ostatnie wyniki */
.topbar { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wipe {
  flex: none; width: 52px; height: 52px; border: 0; border-radius: 10px; cursor: pointer;
  background: var(--fn); color: var(--err);
  display: flex; align-items: center; justify-content: center;
}
.wipe:active { transform: translateY(2px); }
.recent {
  flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  min-height: 52px; min-width: 0; overflow: hidden;
}
.rbtn {
  flex: 0 1 auto; min-width: 0; min-height: 48px; padding: 0 16px;
  border: 0; border-radius: 10px; background: var(--fn); cursor: pointer;
  font-family: var(--mono); font-size: clamp(18px, 3vmin, 26px); font-weight: 600;
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rbtn:nth-last-child(3) { opacity: .5; }
.rbtn:nth-last-child(2) { opacity: .75; }
.rbtn.slide { animation: slide .28s ease-out; }
.rbtn.pop { animation: pop .28s ease-out; }
@keyframes slide { from { transform: translateX(var(--sh, 0px)); } to { transform: translateX(0); } }
@keyframes pop { from { opacity: 0; } }

/* Wyświetlacz: tylko górna kreska */
.display { border-top: 1px solid var(--line); padding: 8px 4px 0; min-width: 0; }
.expr {
  min-height: 2.6em; max-height: 3.9em; overflow-y: auto;
  font-family: var(--mono); font-size: clamp(15px, 2.4vmin, 22px); line-height: 1.3;
  color: var(--muted); text-align: right; overflow-wrap: anywhere;
}
.result {
  text-align: right; white-space: nowrap; overflow-x: auto; scrollbar-width: none;
  font-family: var(--mono); font-weight: 600; line-height: 1.1;
  font-size: clamp(44px, 9vmin, 88px);
  font-variant-numeric: tabular-nums;
}
.result::-webkit-scrollbar { display: none; }
.result.sm { font-size: clamp(34px, 7vmin, 64px); }
.result.xs { font-size: clamp(24px, 5vmin, 42px); }
.result.err { color: var(--err); font-size: clamp(22px, 4vmin, 34px); }

.pad {
  display: grid; gap: 10px; min-height: 0;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(6, minmax(46px, 1fr));
}
.k {
  min-height: 0; border: 0; border-radius: 10px; cursor: pointer;
  font-family: var(--mono); font-size: clamp(22px, 4vmin, 38px); font-weight: 500;
  background: var(--key); color: var(--fg);
  box-shadow: 0 3px 0 var(--key-edge);
  display: flex; align-items: center; justify-content: center; line-height: 1.1;
  user-select: none; -webkit-user-select: none;
}
.k:active { transform: translateY(3px); box-shadow: 0 0 0 var(--key-edge); }
.k.op { background: var(--op); font-weight: 600; }
.k.fn { background: var(--fn); font-size: clamp(20px, 3.4vmin, 32px); }
.k.eq { background: var(--accent); color: var(--accent-fg); grid-column: span 4; font-weight: 600; font-size: clamp(30px, 5vmin, 50px); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000); }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .k:active { transform: none; } .rbtn.slide, .rbtn.pop { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button type="button" id="wipe" class="wipe" aria-label="Wyczyść wszystko" title="Wyczyść wszystko">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
    </button>
    <div class="recent" id="recent" aria-label="Trzy ostatnie wyniki"></div>
  </div>

  <div class="display" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="pad" id="pad"></div>
</div>

<script>
// <pure>
const OPS = ['+', '−', '×', '÷'];

function roundTo(n, d) {
  if (!isFinite(n) || Math.abs(n) >= 1e15) return n;
  const sign = n < 0 ? -1 : 1;
  const a = Math.abs(n);
  const s = String(a);
  if (s.indexOf('e') !== -1) return sign * Number(a.toFixed(d));
  return sign * Number(Math.round(Number(a + 'e' + d)) + 'e-' + d);
}
function groupInt(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function groupTyped(t) {
  const neg = t.charAt(0) === '−';
  const body = neg ? t.slice(1) : t;
  if (body === '') return neg ? '−' : '';
  const parts = body.split('.');
  return (neg ? '−' : '') + groupInt(parts[0]) + (body.indexOf('.') !== -1 ? ',' + (parts[1] || '') : '');
}
function formatNum(n, d, fixed) {
  let r = roundTo(n, d);
  if (Object.is(r, -0)) r = 0;
  let s;
  if (Math.abs(r) >= 1e21) { s = String(r); }
  else {
    s = r.toFixed(d);
    if (!fixed && d > 0) s = s.replace(/\.?0+$/, '');
  }
  const neg = s.charAt(0) === '-';
  const abs = neg ? s.slice(1) : s;
  const parts = abs.split('.');
  const text = (neg ? '−' : '') + groupInt(parts[0]) + (parts[1] ? ',' + parts[1] : '');
  return { text: text, raw: s };
}
function closeExpr(src) {
  let s = src;
  while (/[+−×÷(]$/.test(s)) s = s.slice(0, -1);
  const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
  return s + ')'.repeat(Math.max(0, open));
}
function evaluate(src) {
  const s = closeExpr(src);
  const tokens = s.match(/\d+(?:\.\d*)?|[+−×÷()%]/g) || [];
  if (!tokens.length) return null;
  let p = 0;
  const peek = () => tokens[p];
  function expr() {
    let left = term();
    while (peek() === '+' || peek() === '−') {
      const op = tokens[p++];
      const r = term();
      const rv = r.pct ? left.v * r.v : r.v;
      left = { v: op === '+' ? left.v + rv : left.v - rv, pct: false };
    }
    return left;
  }
  function term() {
    let left = unary();
    while (peek() === '×' || peek() === '÷') {
      const op = tokens[p++];
      const r = unary();
      if (op === '×') left = { v: left.v * r.v, pct: false };
      else {
        if (r.v === 0) throw new Error('div0');
        left = { v: left.v / r.v, pct: false };
      }
    }
    return left;
  }
  function unary() {
    if (peek() === '−') { p++; const u = unary(); return { v: -u.v, pct: u.pct }; }
    if (peek() === '+') { p++; return unary(); }
    return primary();
  }
  function primary() {
    const t = tokens[p++];
    let node;
    if (t === '(') {
      node = expr();
      if (peek() === ')') p++;
      node = { v: node.v, pct: false };
    } else if (t !== undefined && /^\d/.test(t)) {
      node = { v: parseFloat(t), pct: false };
    } else throw new Error('syn');
    while (peek() === '%') { p++; node = { v: node.v / 100, pct: true }; }
    return node;
  }
  const r = expr();
  if (p < tokens.length) throw new Error('syn');
  return Number(r.v.toPrecision(15));
}
function exprDisplay(x) {
  return closeExpr(x)
    .replace(/([\d)%])([+−×÷])/g, '$1 $2 ')
    .replace(/\d+(?:\.\d*)?/g, groupTyped);
}
// </pure>

(function () {
  const $ = id => document.getElementById(id);
  const KEY = 'kalkulator-tasma-v2';
  const DEC = 2;
  let recent = [];
  let st = { expr: '', fresh: false, lastExpr: '' };

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && Array.isArray(d.recent)) {
        recent = d.recent.filter(function (x) { return x && typeof x.raw === 'string' && typeof x.text === 'string'; }).slice(-3);
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ recent: recent })); } catch (e) {}
  }
  const neg = s => s.replace('-', '−');

  /* ---- klawisze ---- */
  function press(k) {
    let s = st.expr;
    const last = s.slice(-1);
    if (/^\d$/.test(k)) {
      if (st.fresh) { s = ''; st.fresh = false; }
      if (/[)%]$/.test(s)) s += '×';
      const m = s.match(/(\d+\.?\d*)$/);
      if (m && /^0+$/.test(m[1])) s = s.slice(0, -m[1].length);
      st.expr = s + k;
    } else if (k === ',') {
      if (st.fresh) { s = ''; st.fresh = false; }
      const m = s.match(/[\d.]+$/);
      if (m) { if (m[0].indexOf('.') !== -1) return; s += '.'; }
      else { if (/[)%]$/.test(s)) s += '×'; s += '0.'; }
      st.expr = s;
    } else if (OPS.indexOf(k) !== -1) {
      st.fresh = false;
      if (s === '') {
        if (k === '−') s = '−';
        else if (recent.length) s = neg(recent[recent.length - 1].raw) + k;
        else return;
      } else if (last === '(') {
        if (k === '−') s += k; else return;
      } else if (OPS.indexOf(last) !== -1) {
        if (s.length === 1) return;
        if (k === '−' && (last === '×' || last === '÷')) s += k;
        else s = s.replace(/[+−×÷]+$/, '') + k;
      } else s += k;
      st.expr = s;
    } else if (k === '(') {
      if (st.fresh) { s = ''; st.fresh = false; }
      if (/[\d)%]$/.test(s)) s += '×';
      st.expr = s + '(';
    } else if (k === ')') {
      const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
      if (open > 0 && /[\d)%]$/.test(s)) st.expr = s + ')'; else return;
    } else if (k === '%') {
      if (/[\d)]$/.test(s)) { st.fresh = false; st.expr = s + '%'; } else return;
    } else if (k === 'back') {
      st.fresh = false;
      st.expr = s.slice(0, -1);
    } else if (k === 'clear') {
      st = { expr: '', fresh: false, lastExpr: '' };
    } else if (k === 'eq') {
      equals();
      return;
    }
    renderDisplay();
  }

  function equals() {
    if (!st.expr || st.fresh) return;
    let v;
    try { v = evaluate(st.expr); } catch (e) { renderDisplay(e.message === 'div0' ? 'Dzielenie przez 0' : 'Błąd w działaniu'); return; }
    if (v === null || !isFinite(v)) return;
    const f = formatNum(v, DEC, true);
    const body = st.expr.replace(/^−/, '');
    st.lastExpr = exprDisplay(st.expr);
    st.expr = neg(f.raw);
    st.fresh = true;
    if (/[+−×÷%(]/.test(body)) {
      recent.push({ raw: f.raw, text: f.text });
      recent = recent.slice(-3);
      save();
      renderRecent(true);
    }
    renderDisplay();
  }

  /* ---- widok ---- */
  function renderDisplay(errMsg) {
    const exprEl = $('expr'), resEl = $('result');
    exprEl.textContent = st.fresh ? st.lastExpr + ' =' : exprDisplay(st.expr);
    exprEl.scrollTop = exprEl.scrollHeight;
    let text = '0', cls = 'result';
    if (errMsg) { text = errMsg; cls += ' err'; }
    else if (st.expr !== '') {
      const body = st.expr.replace(/^−/, '');
      if (/^\d*\.?\d*$/.test(body)) {
        text = groupTyped(st.expr) || '0';
      } else {
        try {
          const v = evaluate(st.expr);
          if (v !== null) text = formatNum(v, DEC, true).text;
        } catch (e) {
          if (e.message === 'div0') { text = 'Dzielenie przez 0'; cls += ' err'; } else text = '—';
        }
      }
    }
    if (cls === 'result') {
      if (text.length > 15) cls += ' xs'; else if (text.length > 10) cls += ' sm';
    }
    resEl.className = cls;
    resEl.textContent = text;
    resEl.scrollLeft = resEl.scrollWidth;
  }

  function renderRecent(animate) {
    const box = $('recent');
    box.textContent = '';
    if (!recent.length) return;
    recent.forEach(function (r, i) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'rbtn';
      b.dataset.i = i;
      b.textContent = r.text;
      b.setAttribute('aria-label', 'Wstaw wynik ' + r.text);
      box.append(b);
    });
    if (animate) {
      const kids = box.children;
      const newest = kids[kids.length - 1];
      const shift = newest.offsetWidth + 10;
      newest.classList.add('pop');
      for (let i = 0; i < kids.length - 1; i++) {
        kids[i].style.setProperty('--sh', shift + 'px');
        kids[i].classList.add('slide');
      }
    }
  }

  /* ---- klawiatura ekranowa ---- */
  const LAYOUT = [
    ['clear', 'C', 'fn'], ['(', '(', 'fn'], [')', ')', 'fn'], ['back', '⌫', 'fn'],
    ['7', '7', ''], ['8', '8', ''], ['9', '9', ''], ['÷', '÷', 'op'],
    ['4', '4', ''], ['5', '5', ''], ['6', '6', ''], ['×', '×', 'op'],
    ['1', '1', ''], ['2', '2', ''], ['3', '3', ''], ['−', '−', 'op'],
    ['0', '0', ''], [',', ',', ''], ['%', '%', 'fn'], ['+', '+', 'op'],
    ['eq', '=', 'eq']
  ];
  const pad = $('pad');
  LAYOUT.forEach(function (c) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'k' + (c[2] ? ' ' + c[2] : '');
    b.dataset.k = c[0];
    b.textContent = c[1];
    if (c[0] === 'back') b.setAttribute('aria-label', 'Usuń ostatni znak');
    if (c[0] === 'clear') b.setAttribute('aria-label', 'Wyczyść');
    if (c[0] === 'eq') b.setAttribute('aria-label', 'Oblicz');
    pad.append(b);
  });
  pad.addEventListener('click', function (e) {
    const b = e.target.closest('button[data-k]');
    if (b) press(b.dataset.k);
  });

  /* ---- ostatnie wyniki: dotknięcie wstawia wynik ---- */
  $('recent').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    const r = recent[Number(b.dataset.i)];
    if (!r) return;
    let s = st.fresh ? '' : st.expr;
    if (/[\d)%]$/.test(s)) s += '×';
    st = { expr: s + neg(r.raw), fresh: false, lastExpr: '' };
    renderDisplay();
  });

  /* ---- wyczyść wszystko: działanie i ostatnie wyniki ---- */
  $('wipe').addEventListener('click', function () {
    st = { expr: '', fresh: false, lastExpr: '' };
    recent = [];
    save();
    renderRecent(false);
    renderDisplay();
  });

  /* ---- klawiatura fizyczna ---- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    let m = null;
    if (/^\d$/.test(k)) m = k;
    else if (k === ',' || k === '.') m = ',';
    else if (k === '+') m = '+';
    else if (k === '-') m = '−';
    else if (k === '*' || k === 'x' || k === 'X') m = '×';
    else if (k === '/') m = '÷';
    else if (k === 'Enter' || k === '=') m = 'eq';
    else if (k === 'Backspace') m = 'back';
    else if (k === 'Escape' || k === 'Delete') m = 'clear';
    else if (k === '(' || k === ')' || k === '%') m = k;
    if (m === null) return;
    e.preventDefault();
    press(m);
  });

  load();
  renderRecent(false);
  renderDisplay();
})();
</script>
</body>
</html>
